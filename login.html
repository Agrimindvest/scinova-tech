<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SciNovaTech</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-container { max-width: 450px; margin: 0 auto; padding: 30px 20px; }
        .login-title { text-align: center; color: var(--cyan); margin-bottom: 8px; font-size: 1.5em; animation: fadeSlideDown 0.5s ease; }
        .login-subtitle { text-align: center; color: var(--text-dim); margin-bottom: 25px; font-size: 0.9em; animation: fadeSlideDown 0.5s ease 0.1s forwards; opacity: 0; }

        @keyframes fadeSlideDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }

        .form-group { animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards; opacity: 0; }
        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.25s; }

        @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        .btn-submit { margin-top: 10px; animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards; animation-delay: 0.35s; opacity: 0; }
        .password-field { position: relative; }
        .password-field .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); transition: all 0.3s; }
        .password-field .toggle-password:hover { color: var(--cyan); }
        .forgot-link { display: block; text-align: right; color: var(--text-dim); font-size: 0.8em; margin-top: -8px; margin-bottom: 15px; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .forgot-link:hover { color: var(--cyan); }
        .form-input:focus { transform: translateY(-2px); }

        .login-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            color: var(--danger);
            font-size: 0.85em;
            display: none;
            text-align: center;
        }
        .login-error.show { display: block; }

        /* NEW: Suspended warning style */
        .login-error.suspended {
            background: rgba(245,158,11,0.12);
            border-color: var(--warning);
            color: var(--warning);
            font-weight: 600;
        }

        .brand-hero {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-hero img { width: 72px; height: 72px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="color:var(--cyan);font-weight:700;">SCN</span>
    </div>

    <div class="login-container">

        <div class="brand-hero">
            <img src="assets/img/logo.svg" alt="SciNovaTech">
        </div>

        <h2 class="login-title">🔐 Welcome Back</h2>
        <p class="login-subtitle">Login to continue earning</p>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <div class="password-field">
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                </div>
            </div>
            <a href="#" class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
            <button type="submit" class="btn btn-primary btn-block btn-submit" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> LOGIN
            </button>
        </form>

        <p style="text-align:center;margin-top:20px;color:var(--text-dim);font-size:0.9em;animation:slideUp 0.5s ease 0.45s forwards;opacity:0;">
            New here? <a href="register.html" style="color:var(--cyan);">Create Account →</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=3"></script>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function forgotPassword() {
            toast('📧 Contact support: ' + ADMIN_EMAIL + ' to reset your password.');
        }

        function showError(message, isSuspended = false) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            if (isSuspended) errorEl.classList.add('suspended');
            else errorEl.classList.remove('suspended');
            setTimeout(() => {
                errorEl.classList.remove('show');
                errorEl.classList.remove('suspended');
            }, 8000);
        }

        window.addEventListener('load', () => {
            // ============ CHECK SUSPENDED REDIRECT ============
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reason') === 'suspended') {
                showError('⚠️ Your account has been suspended. Contact support for more info.', true);
                // Clean URL so the message doesn't repeat on refresh
                window.history.replaceState({}, '', 'login.html');
            }

            // If already logged in, go to home
            const savedUser = localStorage.getItem('scn_u');
            if (savedUser) {
                try {
                    const u = JSON.parse(savedUser);
                    if (u && u.id && u.status !== 'suspended') {
                        window.location.href = 'home.html';
                    } else if (u && u.status === 'suspended') {
                        localStorage.removeItem('scn_u');
                    }
                } catch (e) {}
            }
        });

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please fill all fields');
                return;
            }

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            try {
                const { data: rpcResult, error: rpcError } = await sb.rpc('login_user', {
                    p_email: email,
                    p_password: password
                });

                if (rpcError) throw rpcError;

                if (!rpcResult || rpcResult.error) {
                    if (rpcResult?.error === 'suspended') {
                        showError('⚠️ Your account has been suspended. Contact support for more info.', true);
                    } else {
                        showError('❌ Invalid email or password. Please try again.');
                    }
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                const user = rpcResult.user;

                // Extra client-side safety: reject suspended users even if DB allows
                if (user.status === 'suspended') {
                    showError('⚠️ Your account has been suspended. Contact support for more info.', true);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                localStorage.setItem('scn_u', JSON.stringify(user));

                toast('Welcome back, ' + user.name + '! 🎉');

                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 600);

            } catch (error) {
                console.error('Login error:', error);
                btn.disabled = false;
                btn.innerHTML = originalText;

                if (error.message && error.message.includes('Failed to fetch')) {
                    showError('❌ Network error. Please check your connection.');
                } else {
                    showError('❌ Login failed: ' + (error.message || 'Please try again.'));
                }
            }
        }
    </script>
</body>
</html>
