<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Profile - SciNovaTech</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .profile-container { max-width: 500px; margin: 0 auto; }
        .profile-header-card { text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
        .profile-avatar {
            font-size: 4em;
            color: var(--cyan);
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--cyan-glow));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .profile-name { font-size: 1.3em; font-weight: 700; color: var(--cyan); font-family: 'Space Grotesk', sans-serif; }
        .profile-id { color: var(--text-dim); font-size: 0.8em; margin: 5px 0; }
        .profile-balance-mini {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
            font-family: 'Space Grotesk', sans-serif;
        }
        .menu-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="home.html" class="logo">
            <img src="assets/img/logo.svg" alt="SciNovaTech">
            <span>SciNovaTech</span>
        </a>
        <div class="icons">
            <a href="profile.html"><i class="fas fa-user-circle"></i></a>
        </div>
    </header>

    <div class="main-content">
        <a href="home.html" style="color:var(--cyan);text-decoration:none;display:flex;align-items:center;gap:5px;margin-bottom:15px;font-size:0.9em;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="profile-container">
            <h3 style="color:var(--cyan);margin-bottom:15px;">👤 My Profile</h3>

            <div class="card profile-header-card">
                <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
                <div class="profile-name" id="profileName">-</div>
                <div class="profile-id" id="profileId">ID: -</div>
                <div id="profileStatus" style="margin:8px 0;"></div>
                <div class="profile-balance-mini" id="profileBalance">₦0</div>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <a href="deposit.html" class="btn btn-gold btn-sm" style="flex:1;"><i class="fas fa-plus-circle"></i> Deposit</a>
                    <a href="withdraw.html" class="btn btn-outline btn-sm" style="flex:1;"><i class="fas fa-arrow-up"></i> Withdraw</a>
                </div>
            </div>

            <div class="menu-card">
                <a href="bank.html" class="menu-item">
                    <div class="mi"><i class="fas fa-university"></i> Bank Accounts</div>
                    <i class="fas fa-chevron-right"></i>
                </a>
            </div>
            <div class="menu-card">
                <a href="history.html" class="menu-item">
                    <div class="mi"><i class="fas fa-history"></i> Transaction History</div>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <a href="tasks.html" class="menu-item">
                    <div class="mi"><i class="fas fa-tasks"></i> Daily Tasks</div>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <a href="referral.html" class="menu-item">
                    <div class="mi"><i class="fas fa-users"></i> My Team / Referrals</div>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <a href="read.html" class="menu-item">
                    <div class="mi"><i class="fas fa-book-open"></i> Read Articles</div>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <div class="menu-item" onclick="contactSupport()">
                    <div class="mi"><i class="fas fa-headset"></i> Customer Support</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item logout-item" onclick="handleLogout()">
                    <div class="mi"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="plans.html" class="nav-item"><i class="fas fa-layer-group"></i><span>Plans</span></a>
        <a href="deposit.html" class="nav-item"><i class="fas fa-credit-card"></i><span>Deposit</span></a>
        <a href="tasks.html" class="nav-item"><i class="fas fa-tasks"></i><span>Tasks</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=3"></script>
    <script>
        const user = checkAuth();
        if (!user) window.location.href = 'login.html';

        let currentUser = user;

        window.addEventListener('load', async () => {
            currentUser = await refreshUser();
            loadProfile();
        });

        function loadProfile() {
            document.getElementById('profileName').textContent = currentUser.name || '-';
            document.getElementById('profileId').textContent = 'ID: ' + (currentUser.id || '-');
            document.getElementById('profileBalance').textContent = fmt(currentUser.balance || 0);

            const statusEl = document.getElementById('profileStatus');
            if (currentUser.status === 'active') {
                statusEl.innerHTML = '<span class="plan-badge badge-active">🟢 Active</span>';
            } else if (currentUser.status === 'suspended') {
                statusEl.innerHTML = '<span class="plan-badge badge-sold">🔴 Suspended</span>';
            } else {
                statusEl.innerHTML = '<span class="plan-badge badge-locked">⚫ ' + (currentUser.status || 'Unknown') + '</span>';
            }
        }

        function contactSupport() {
            window.location.href = 'mailto:' + ADMIN_EMAIL + '?subject=SciNovaTech Support - ' + currentUser.name;
        }

        function handleLogout() {
            if (confirm('Sign out?')) {
                localStorage.removeItem('scn_u');
                toast('Signed out');
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            }
        }
    </script>
</body>
</html>
