<p>Physics isn't just in textbooks. It's in every step you take, every cup of coffee you pour, every door you open. Understanding the physics behind daily life makes the world more interesting and helps you solve problems faster.</p>

<h3>Why Ice Floats</h3>

<p>Water is unusual: it's denser as a liquid than as a solid. This is because of hydrogen bonds. In liquid water, molecules pack relatively close. In ice, hydrogen bonds force the molecules into a hexagonal lattice with empty spaces — making ice less dense.</p>

<p>This is why:</p>
<ul>
<li>Ice floats (life can survive under frozen lakes)</li>
<li>Pipes burst when water freezes (expansion creates pressure)</li>
<li>Water bottles crack in freezers</li>
</ul>

<h3>Why You Feel Cold in the Wind</h3>

<p>Wind chill isn't about the actual temperature — it's about heat loss.</p>

<p>Your body constantly produces heat, and a thin layer of warm air sits next to your skin. Wind blows this layer away, forcing your body to heat new air. The faster the wind, the faster you lose heat.</p>

<p>Wind chill chart example: at 0°C with 40 km/h wind, it feels like -7°C.</p>

<h3>Why a Spinning Ice Skater Speeds Up</h3>

<p>Conservation of angular momentum. When a skater pulls their arms in, their moment of inertia decreases, so their rotation rate increases to keep angular momentum constant.</p>

<div class="formula-box">L = I × ω</div>

<p>Where L is angular momentum, I is moment of inertia, and ω is angular velocity. If I decreases and L is conserved, ω must increase.</p>

<h3>Why Airplane Wings Generate Lift</h3>

<p>Two main explanations (both partly correct):</p>

<ol>
<li><strong>Bernoulli principle:</strong> Air moves faster over the top of the wing, creating lower pressure. Higher pressure underneath pushes the wing up.</li>
<li><strong>Newton's third law:</strong> The wing deflects air downward, and the air pushes the wing up.</li>
</ol>

<p>Modern understanding: both are part of the story, and the full picture involves circulation theory (Kutta-Joukowski).</p>

<h3>Why Microwaves Heat Food Unevenly</h3>

<p>Microwave ovens emit electromagnetic waves at 2.45 GHz. These waves cause water molecules to rotate billions of times per second, generating heat through friction.</p>

<p>But the waves form standing wave patterns inside the oven. Cold spots occur where the waves cancel out. That's why you need a rotating turntable or should stir your food.</p>

<p>Microwaves don't "cook from the inside out" — they penetrate about 1-2 cm, then heat transfers by conduction.</p>

<h3>Why Spicy Food Feels Hot</h3>

<p>Capsaicin — the chemical in chili peppers — binds to TRPV1 receptors on your tongue. These receptors normally detect actual heat (above 43°C). Capsaicin tricks them into firing as if they detected heat.</p>

<p>Your brain perceives this as burning. Drinking water doesn't help (capsaicin isn't water-soluble). Milk or yogurt does (casein protein breaks the bond).</p>

<h3>Why Soap Cleans</h3>

<p>Water alone can't dissolve oils. Soap molecules have a water-loving head and an oil-loving tail. The tails surround oil droplets, forming micelles that can be washed away.</p>

<p>This is why soap works on grease. Without soap, water just slides off oily surfaces.</p>

<h3>Why the Sky Is Blue</h3>

<p>Sunlight contains all colors. When it enters the atmosphere, molecules scatter shorter wavelengths (blue) more than longer wavelengths (red). This is Rayleigh scattering:</p>

<div class="formula-box">Scattering ∝ 1 / λ⁴</div>

<p>Blue light (450 nm) scatters about 5.5 times more than red light (650 nm). So when you look up, you see scattered blue light coming from all directions.</p>

<p>At sunset, sunlight passes through more atmosphere. Blue is scattered away, leaving red and orange. Same reason astronauts see black sky — no atmosphere to scatter light.</p>

<h3>Why Coffee Cools Faster When You Blow On It</h3>

<p>Evaporation. Blowing removes the layer of water vapor above the coffee, allowing more water to evaporate. Evaporation requires energy (latent heat of vaporization), which comes from the coffee itself — cooling it down.</p>

<p>This is why sweating cools you. Evaporating sweat removes heat from your body.</p>

<h3>Why Ships Float</h3>

<p>Archimedes' principle: a floating object displaces its own weight in water. Ships are mostly hollow, so their average density is lower than water. Even steel ships float because of the air inside.</p>

<p>Submarines control their density by filling ballast tanks with water or air.</p>

<h3>Why Helium Makes Your Voice Squeaky</h3>

<p>Helium is less dense than air. Sound travels faster through helium (~970 m/s vs. 343 m/s in air). The speed change affects the resonant frequencies of your vocal tract, producing the characteristic high-pitched voice.</p>

<p>It's not because your vocal cords vibrate faster — they don't. It's about resonance.</p>

<h3>Why a Full Bottle Sounds Different When You Blow Over It</h3>

<p>The pitch depends on the volume of air. Filling with water reduces the air column. Smaller air column = higher frequency = higher pitch.</p>

<div class="formula-box">f = v / 4L</div>

<p>Where v is the speed of sound and L is the length of the air column. Shorter column = higher pitch.</p>

<h3>Why Static Electricity Shocks You in Winter</h3>

<p>When you walk on carpet, friction transfers electrons from the carpet to you. In humid conditions, moisture in the air allows the charge to dissipate. In dry winter air, charge builds up until you touch something metal — the discharge is the shock.</p>

<h3>Why Cars Have Antilock Brakes</h3>

<p>Sliding friction is weaker than static friction. When a tire locks and slides, it loses grip. ABS pumps the brakes 15-20 times per second, keeping tires at the edge of static friction.</p>

<p>Result: shorter stopping distances, especially on wet or icy roads.</p>

<div class="hack-box">
<h4>💡 Everyday Physics Hacks</h4>
<ul>
<li><strong>Cool coffee faster:</strong> Blow on it (evaporative cooling) or use a wide cup (more surface area)</li>
<li><strong>Defrost food faster:</strong> Submerge in cold water (faster than air)</li>
<li><strong>Keep drinks cold:</strong> Wrap in wet cloth (evaporation cools)</li>
<li><strong>Open jars easier:</strong> Run lid under hot water (metal expands)</li>
<li><strong>Unscrew tight bolts:</strong> Heat the bolt, cool the nut (differential expansion)</li>
<li><strong>Prevent ice on windshield:</strong> Park facing east (morning sun melts)</li>
</ul>
</div>

<h3>What Is mRNA?</h3>

<p>mRNA stands for <strong>messenger RNA</strong>. It's a temporary molecular message that carries instructions from DNA to ribosomes, where proteins are built.</p>

<p>Every day, you make hundreds of decisions. Some are trivial (what to eat), some are life-changing (whom to marry). Decision science gives us tools to make better choices — even under uncertainty.</p>

<p>This is a guide to the mathematics of good decisions.</p>

<h3>Expected Value</h3>

<p>Expected value (EV) is the average outcome if you made the same decision many times.</p>

<div class="formula-box">EV = Σ (probability × outcome)</div>

<p>Example: You can invest ₦100,000 in a project with a 30% chance of returning ₦500,000 and a 70% chance of returning ₦0. EV = 0.3 × 500,000 = ₦150,000. Positive EV, so it's worth doing.</p>

<p>Or: A lottery ticket costs ₦100 with a 1-in-1,000,000 chance of winning ₦50 million. EV = 0.000001 × 50,000,000 = ₦50. Negative EV, so don't play.</p>

<h3>The Kelly Criterion</h3>

<p>For repeated bets with positive EV, how much should you stake?</p>

<div class="formula-box">f = (bp - q) / b</div>

<p>Where f is fraction of bankroll, b is odds received, p is probability of winning, q is probability of losing.</p>

<p>Example: You have a 60% chance of winning a bet that pays 1:1. Kelly says: f = (1 × 0.6 - 0.4) / 1 = 0.2 — bet 20% of your bankroll.</p>

<p>Most people use half-Kelly for safety.</p>

<h3>Sunk Cost Fallacy</h3>

<p>Money, time, or effort already spent is gone — it shouldn't affect future decisions.</p>

<p>Example: You bought a movie ticket for ₦5,000. You feel sick. Should you go? No — the ₦5,000 is gone either way. The decision should be based on whether you'll enjoy it, not on what you already paid.</p>

<p>Businesses fall for this all the time: throwing good money after bad investments.</p>

<h3>Opportunity Cost</h3>

<p>The value of the next-best alternative. Every yes is a no to something else.</p>

<p>Example: Going to a 3-hour party means you can't work, study, or sleep for those hours. If your time is worth ₦5,000/hour, the party costs ₦15,000 in opportunity cost.</p>

<p>This is why CEOs hire assistants — the CEO's time is worth more doing CEO things than admin work.</p>

<h3>Risk vs. Uncertainty</h3>

<ul>
<li><strong>Risk:</strong> Known probabilities. A fair coin toss.</li>
<li><strong>Uncertainty:</strong> Unknown probabilities. Predicting an election.</li>
</ul>

<p>Most real-world decisions are uncertain, not risky. This means we need to think in scenarios, not just probabilities.</p>

<h3>Probability Neglect</h3>

<p>People overreact to rare events (plane crashes) and ignore common ones (car accidents). We fear dramatic risks more than statistical ones.</p>

<p>Reality: In most countries, you're 100x more likely to die in a car than a plane. But fear of flying is much more common than fear of driving.</p>

<p>To make better decisions: think about base rates, not vivid stories.</p>

<h3>Bayesian Thinking</h3>

<p>Bayes' theorem tells you how to update beliefs with evidence:</p>

<div class="formula-box">P(A|B) = P(B|A) × P(A) / P(B)</div>

<p>Practical version: Start with a prior belief. See evidence. Update to a posterior belief. Repeat.</p>

<p>Example: You think there's a 10% chance your friend is angry with you. They cancel plans. Does that update your belief? Yes — but not to 100%. Depends on how often they cancel for other reasons.</p>

<h3>Anchoring</h3>

<p>The first number you see influences your estimate, even if it's arbitrary.</p>

<p>Classic study: People were asked if the percentage of African countries in the UN is higher or lower than 10 (or 65). Then asked to estimate. The group given 10 guessed ~25%; the group given 65 guessed ~45%.</p>

<p>Negotiation tip: make the first offer — it anchors the conversation.</p>

<h3>Loss Aversion</h3>

<p>Losing ₦10,000 feels about twice as bad as gaining ₦10,000 feels good. This asymmetry affects every decision.</p>

<p>Implications:</p>
<ul>
<li>We hold onto losing stocks too long (don't want to realize a loss)</li>
<li>We're more likely to take risks to avoid a loss than to achieve a gain</li>
<li>Framing a decision as "loss" or "gain" changes our choice</li>
</ul>

<p>Marketers exploit this: "Don't miss out" is more powerful than "You could gain."</p>

<h3>Systems vs. Goals</h3>

<p>Goals are outcomes. Systems are processes.</p>

<p>Winners focus on systems. Example: "I want to lose 10 kg" is a goal. "I'll eat vegetables at every meal" is a system.</p>

<p>Systems win because they're automatic, not willpower-dependent.</p>

<h3>Reversible vs. Irreversible Decisions</h3>

<p>Two types of decisions require different approaches:</p>

<ul>
<li><strong>Reversible:</strong> Make fast, learn from mistakes. Example: choosing a Netflix show.</li>
<li><strong>Irreversible:</strong> Slow down, gather information. Example: getting married, quitting a job.</li>
</ul>

<p>Most people are too slow on reversible decisions and too fast on irreversible ones.</p>

<h3>The 10/10/10 Rule</h3>

<p>Before a decision, ask:</p>
<ul>
<li>How will I feel in 10 minutes?</li>
<li>How will I feel in 10 months?</li>
<li>How will I feel in 10 years?</li>
</ul>

<p>This zooms out and helps you see if a small emotional impulse is driving a big decision.</p>

<div class="hack-box">
<h4>💡 A Simple Framework for Big Decisions</h4>
<ol>
<li><strong>What's the actual decision?</strong> — be specific</li>
<li><strong>What are the options?</strong> — including doing nothing</li>
<li><strong>What's the best case?</strong> — realistically, not fantasy</li>
<li><strong>What's the worst case?</strong> — can you survive it?</li>
<li><strong>What's the most likely?</strong> — think probabilistically</li>
<li><strong>What information would change your mind?</strong> — seek it</li>
<li><strong>What's reversible vs. not?</strong> — act fast on reversible</li>
</ol>
</div>

<p>Earth's surface is in constant motion. Continents drift, mountains rise, oceans open and close. The theory of plate tectonics explains all of it — and it's one of the great unifying theories of modern science.</p>

<p>This is a complete guide to plate tectonics.</p>

<h3>Before Plate Tectonics</h3>

<p>In the early 20th century, geologists noticed that continents looked like puzzle pieces. South America and Africa fit together. Fossil records matched across oceans. Rock formations aligned.</p>

<p>In 1912, Alfred Wegener proposed "continental drift" — that continents once formed a single supercontinent (Pangaea) and later broke apart.</p>

<p>He was ridiculed. He couldn't explain <em>how</em> continents moved.</p>

<p>It took until the 1960s for the mechanism to be discovered.</p>

<h3>Plate Tectonics</h3>

<p>Earth's outer shell — the <strong>lithosphere</strong> — is broken into about 20 tectonic plates. These plates float on the semi-molten <strong>asthenosphere</strong> below and move 2-10 cm per year (roughly the rate fingernails grow).</p>

<p>Major plates:</p>
<ul>
<li><strong>Pacific Plate:</strong> Largest, covers most of the Pacific Ocean</li>
<li><strong>North American Plate:</strong> Includes most of North America and part of the Atlantic</li>
<li><strong>Eurasian Plate:</strong> Includes most of Europe and Asia</li>
<li><strong>African Plate:</strong> Includes Africa and surrounding ocean</li>
<li><strong>Antarctic Plate:</strong> Covers Antarctica and surrounding ocean</li>
<li><strong>Indo-Australian Plate:</strong> Includes India, Australia, and surrounding ocean</li>
<li><strong>South American Plate:</strong> Includes South America and part of the Atlantic</li>
</ul>

<p>Smaller plates (Nazca, Cocos, Caribbean, Arabian, Philippine) fill in the gaps.</p>

<h3>Why Plates Move</h3>

<p>Three driving forces:</p>

<ol>
<li><strong>Mantle convection:</strong> Heat from Earth's core causes mantle rock to rise and fall, dragging plates</li>
<li><strong>Slab pull:</strong> Cold, dense oceanic plates sink at subduction zones, pulling the rest of the plate</li>
<li><strong>Ridge push:</strong> New oceanic crust at mid-ocean ridges is elevated, creating a slope that pushes plates away</li>
</ol>

<p>Slab pull is now believed to be the dominant force.</p>

<h3>Types of Plate Boundaries</h3>

<h4>Divergent Boundaries</h4>
<p>Plates move apart. New crust forms from rising magma.</p>
<ul>
<li><strong>Example:</strong> Mid-Atlantic Ridge. North America and Eurasia are moving apart ~2.5 cm/year. Iceland sits on this ridge and is tearing apart.</li>
<li><strong>Result:</strong> Ocean basins widen; continents separate</li>
</ul>

<h4>Convergent Boundaries</h4>
<p>Plates move together. One often subducts (sinks under) the other.</p>
<ul>
<li><strong>Ocean-ocean:</strong> Island arcs (Japan, Philippines).</li>
<li><strong>Ocean-continent:</strong> Mountain ranges (Andes) + volcanic arcs.</li>
<li><strong>Continent-continent:</strong> Mountain ranges (Himalayas — India colliding with Asia).</li>
</ul>

<h4>Transform Boundaries</h4>
<p>Plates slide past each other horizontally. Crust is neither created nor destroyed.</p>
<ul>
<li><strong>Example:</strong> San Andreas Fault (California). Pacific and North American plates slide past each other.</li>
<li><strong>Result:</strong> Frequent earthquakes, no volcanoes</li>
</ul>

<h3>Evidence for Plate Tectonics</h3>

<ul>
<li><strong>Continental fit:</strong> Continents match up like puzzle pieces</li>
<li><strong>Fossil correlation:</strong> Same fossils found on continents now separated by oceans</li>
<li><strong>Rock formations:</strong> Same rock types and ages match across oceans</li>
<li><strong>Paleoclimate:</strong> Glacial deposits in tropical regions suggest continents moved</li>
<li><strong>Magnetic striping:</strong> Ocean floor has alternating magnetic stripes recording past field reversals</li>
<li><strong>Earthquake and volcano distribution:</strong> Both concentrate at plate boundaries</li>
<li><strong>GPS measurements:</strong> Directly measure plate motion</li>
</ul>

<h3>Earthquakes</h3>

<p>Earthquakes happen when stress builds up along faults until rocks break, releasing energy as seismic waves.</p>

<p>Magnitude scale (moment magnitude, Mw):</p>
<ul>
<li><strong>M 4-5:</strong> Light, felt but little damage</li>
<li><strong>M 6:</strong> Moderate, damage in populated areas</li>
<li><strong>M 7:</strong> Major, serious damage over large areas</li>
<li><strong>M 8:</strong> Great, near-total destruction near epicenter</li>
<li><strong>M 9:</strong> Devastating (e.g., 2011 Japan)</li>
</ul>

<p>Each whole number increase = 32× more energy released. So M8 is 32× M7, and M9 is 1,024× M7.</p>

<h3>Volcanoes</h3>

<p>Volcanoes form where magma reaches the surface. Most occur at:</p>
<ul>
<li><strong>Subduction zones:</strong> Ocean plate sinks under another, magma rises (Ring of Fire)</li>
<li><strong>Mid-ocean ridges:</strong> New crust forms</li>
<li><strong>Hotspots:</strong> Fixed mantle plumes (Hawaii, Yellowstone)</li>
</ul>

<p>Types:</p>
<ul>
<li><strong>Shield:</strong> Broad, gentle slopes, low-viscosity lava (Hawaii)</li>
<li><strong>Stratovolcano:</strong> Steep, explosive (Mount Fuji, Mount St. Helens)</li>
<li><strong>Cinder cone:</strong> Small, short-lived</li>
</ul>

<h3>The Ring of Fire</h3>

<p>About 75% of Earth's volcanoes and 90% of its earthquakes occur in the Pacific Ring of Fire — a horseshoe-shaped zone around the Pacific Ocean. It's caused by several subduction zones.</p>

<h3>Continental Drift Continues</h3>

<ul>
<li><strong>Africa and South America:</strong> Moving apart 3 cm/year</li>
<li><strong>India and Asia:</strong> Still colliding, Himalayas rising 5 mm/year</li>
<li><strong>Australia:</strong> Moving north 7 cm/year, will collide with Asia in ~50 million years</li>
<li><strong>East Africa:</strong> Rifting apart — a new ocean will form in ~10 million years</li>
<li><strong>California:</strong> West of San Andreas will slide north, eventually colliding with Alaska</li>
</ul>

<h3>Supercontinents Past and Future</h3>

<p>Pangaea (250 million years ago) was the most recent supercontinent.</p>

<p>Earlier:</p>
<ul>
<li><strong>Rodinia:</strong> ~1 billion years ago</li>
<li><strong>Columbia:</strong> ~1.8 billion years ago</li>
<li><strong>Kenorland:</strong> ~2.7 billion years ago</li>
<li><strong>Vaalbara:</strong> ~3.6 billion years ago</li>
</ul>

<p>The next supercontinent (Amasia) is expected in 200-300 million years, as the Pacific Ocean closes and continents converge.</p>

<div class="hack-box">
<h4>💡 Why This Matters</h4>
<p>Plate tectonics explains:</p>
<ul>
<li><strong>Where earthquakes occur</strong> — plate boundaries</li>
<li><strong>Where volcanoes are</strong> — subduction zones and hotspots</li>
<li><strong>Where mountains form</strong> — convergent boundaries</li>
<li><strong>Why we have continents</strong> — billions of years of plate interactions</li>
<li><strong>Why Earth has a stable climate</strong> — the carbon cycle driven by plate tectonics</li>
</ul>
</div>

<p>Light is the fastest thing in the universe, the medium of vision, and the foundation of modern physics. It behaves like a wave and like a particle. It has no mass but carries energy. It bends, refracts, reflects, and interferes.</p>

<p>This is the complete story of light.</p>

<h3>The Speed of Light</h3>

<div class="formula-box">c = 299,792,458 m/s</div>

<p>This is exact — it defines the meter. Light takes 8.3 minutes to reach Earth from the Sun and 1.28 seconds to reach us from the Moon.</p>

<p>This is the cosmic speed limit. No information can travel faster.</p>

<h3>The Wave Nature of Light</h3>

<p>Light is an electromagnetic wave — oscillating electric and magnetic fields traveling through space.</p>

<ul>
<li><strong>Wavelength (λ):</strong> Distance between two peaks</li>
<li><strong>Frequency (f):</strong> Oscillations per second</li>
<li><strong>Speed:</strong> c = λ × f</li>
</ul>

<div class="formula-box">c = λ × f</div>

<p>Longer wavelength = lower frequency = lower energy. Shorter wavelength = higher frequency = higher energy.</p>

<h3>The Electromagnetic Spectrum</h3>

<p>In order of increasing energy:</p>

<ol>
<li><strong>Radio waves:</strong> &gt; 1 mm. Used for communication, MRI.</li>
<li><strong>Microwaves:</strong> 1 mm - 1 μm. Radar, microwave ovens, Wi-Fi.</li>
<li><strong>Infrared:</strong> 1 μm - 700 nm. Thermal imaging, remote controls.</li>
<li><strong>Visible light:</strong> 700 - 400 nm. What we see.</li>
<li><strong>Ultraviolet:</strong> 400 - 10 nm. Causes sunburn, sterilizes.</li>
<li><strong>X-rays:</strong> 10 nm - 0.01 nm. Medical imaging.</li>
<li><strong>Gamma rays:</strong> &lt; 0.01 nm. Nuclear, cancer treatment.</li>
</ol>

<h3>The Particle Nature of Light</h3>

<p>In 1900, Planck showed that energy comes in discrete packets called <strong>quanta</strong>. In 1905, Einstein applied this to light: light is made of particles called <strong>photons</strong>.</p>

<div class="formula-box">E = h × f</div>

<p>Where h is Planck's constant (6.626 × 10⁻³⁴ J·s). Higher frequency = more energetic photons.</p>

<p>This explained the photoelectric effect: shining light on metal ejects electrons only if the light's frequency is high enough. A particle picture explains this; a wave picture doesn't.</p>

<h3>Wave-Particle Duality</h3>

<p>Light behaves as both a wave and a particle, depending on the experiment.</p>

<ul>
<li><strong>Interference and diffraction</strong> (wave behavior)</li>
<li><strong>Photoelectric effect</strong> (particle behavior)</li>
<li><strong>Double-slit with single photons</strong> — each photon lands as a point, but the pattern builds up as waves</li>
</ul>

<p>This isn't a limitation of our measurements — it's fundamental. Light <em>is</em> both.</p>

<h3>Reflection</h3>

<p>Light bounces off surfaces. The angle of incidence equals the angle of reflection.</p>

<div class="formula-box">θᵢ = θᵣ</div>

<p>Mirrors reflect specularly (clean reflection); rough surfaces reflect diffusely (scattered).</p>

<h3>Refraction</h3>

<p>Light bends when entering a different medium because its speed changes.</p>

<div class="formula-box">n₁ sin θ₁ = n₂ sin θ₂</div>

<p>Snell's law. n is the refractive index (vacuum = 1, water = 1.33, glass = 1.5, diamond = 2.42).</p>

<p>Refraction causes:</p>
<ul>
<li>Straws appearing bent in water</li>
<li>Mirages on hot roads</li>
<li>Prisms splitting light into colors</li>
<li>Lenses focusing light</li>
<li>Rainbows</li>
</ul>

<h3>Dispersion</h3>

<p>Different colors refract at different angles because their speeds in a medium differ slightly. This is why prisms split white light into a rainbow.</p>

<p>Colors in order: red (least refracted), orange, yellow, green, blue, violet (most refracted).</p>

<h3>Interference</h3>

<p>When two light waves meet, they can reinforce (constructive) or cancel (destructive).</p>

<div class="formula-box">Constructive: path difference = nλ<br>
Destructive: path difference = (n + ½)λ</div>

<p>Interference produces:</p>
<ul>
<li>Soap bubble colors</li>
<li>Oil slicks on water</li>
<li>Anti-reflective coatings on glasses</li>
<li>Holograms</li>
</ul>

<h3>Polarization</h3>

<p>Light waves oscillate in a plane perpendicular to their direction of travel. If all oscillations are in one plane, the light is polarized.</p>

<p>Polarization is used in:</p>
<ul>
<li>Polarized sunglasses (reduce glare)</li>
<li>LCD screens</li>
<li>3D movies</li>
<li>Stress analysis in materials</li>
</ul>

<h3>Light and Color</h3>

<p>Color is our brain's interpretation of wavelength:</p>

<div class="formula-box">
Violet: 380-450 nm<br>
Blue: 450-495 nm<br>
Green: 495-570 nm<br>
Yellow: 570-590 nm<br>
Orange: 590-620 nm<br>
Red: 620-750 nm
</div>

<p>Objects appear colored because they reflect some wavelengths and absorb others. Leaves look green because chlorophyll absorbs red and blue, reflecting green.</p>

<p>Primary colors of light: red, green, blue (RGB). All colors of light can be made by mixing these. Pigments work differently — they subtract colors, so primary pigments are cyan, magenta, yellow (CMY).</p>

<h3>The Double-Slit Experiment</h3>

<p>The most famous experiment in quantum physics:</p>
<ol>
<li>Fire light through two narrow slits.</li>
<li>If light were particles, you'd see two bright bands.</li>
<li>Instead, you see an interference pattern — alternating bright and dark bands.</li>
<li>Fire one photon at a time: each photon lands as a single point, but over time, the pattern still emerges.</li>
<li>Observe which slit the photon goes through: the pattern disappears.</li>
</ol>

<p>This shows that measurement fundamentally affects quantum systems.</p>

<h3>Applications</h3>

<ul>
<li><strong>Lasers:</strong> Coherent, monochromatic light for cutting, surgery, communication</li>
<li><strong>Fiber optics:</strong> Light guided through glass fibers for communication</li>
<li><strong>Solar cells:</strong> Convert light into electricity</li>
<li><strong>LEDs:</strong> Electrons and holes recombine to emit light</li>
<li><strong>Photography:</strong> Light captured by sensors</li>
<li><strong>Medical imaging:</strong> X-rays, OCT, fluorescence</li>
<li><strong>Quantum computing:</strong> Photons as qubits</li>
</ul>

<div class="hack-box">
<h4>💡 Understanding Light in Everyday Life</h4>

<li><strong>Mirages happen</strong> — light bends through hot air above roads</li>
<li><strong>Soap bubbles are colorful</strong> — interference between reflected waves</li>
<li><strong>Polarized sunglasses work</strong> — they block light reflected off horizontal surfaces</li>
</ul>
</div>
