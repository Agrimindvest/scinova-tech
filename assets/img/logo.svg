<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="snGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon frame -->
  <polygon points="100,15 175,57.5 175,142.5 100,185 25,142.5 25,57.5"
           fill="none" stroke="url(#hexGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner hexagon outline -->
  <polygon points="100,30 162,65 162,135 100,170 38,135 38,65"
           fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

  <!-- Circuit trace lines -->
  <path d="M 60 100 L 80 100 L 85 90 L 95 90" stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 140 100 L 120 100 L 115 110 L 105 110" stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="60" cy="100" r="2" fill="#00E5FF"/>
  <circle cx="140" cy="100" r="2" fill="#00E5FF"/>

  <!-- SN monogram -->
  <text x="100" y="125" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="60" font-weight="800"
        text-anchor="middle" fill="url(#snGrad)" filter="url(#glow)">SN</text>

  <!-- Orbiting electron path -->
  <ellipse cx="100" cy="100" rx="72" ry="28" fill="none" stroke="#7C3AED"
           stroke-width="1.5" opacity="0.5" transform="rotate(-25 100 100)"/>
  <ellipse cx="100" cy="100" rx="72" ry="28" fill="none" stroke="#0057FF"
           stroke-width="1.5" opacity="0.4" transform="rotate(25 100 100)"/>

  <!-- Electrons -->
  <circle cx="172" cy="82" r="4" fill="#00E5FF" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="118" r="3" fill="#7C3AED" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate"
      from="360 100 100" to="0 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Nucleus -->
  <circle cx="100" cy="100" r="6" fill="#FFB800" filter="url(#glow)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
