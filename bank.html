<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bank Accounts - SciNovaTech</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .bank-container { max-width: 520px; margin: 0 auto; }
        .bank-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .bank-list-item:hover { border-color: var(--cyan); }
        .bank-info { flex: 1; }
        .bank-name { font-weight: 700; color: var(--cyan); }
        .bank-detail { font-size: 0.9em; color: var(--text-dim); margin-top: 4px; }
        .delete-bank-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1em;
            padding: 6px;
        }
        .delete-bank-btn:hover { opacity: 0.75; }
    </style>
</head>
<body>

    <header class="header">
        <a href="home.html" class="logo">
            <img src="assets/img/logo.svg" alt="SciNovaTech">
            <span>SciNovaTech</span>
        </a>
        <div class="icons"><a href="profile.html"><i class="fas fa-user-circle"></i></a></div>
    </header>

    <div class="main-content">
        <a href="home.html" style="color:var(--cyan);text-decoration:none;display:flex;align-items:center;gap:5px;margin-bottom:15px;font-size:0.9em;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="bank-container">
            <h3 style="color:var(--cyan);margin-bottom:15px;">🏦 Bank Accounts</h3>
            <div id="savedBanks" class="card" style="padding:14px;text-align:center;color:var(--text-dim);">
                Loading bank accounts...
            </div>

            <button class="btn btn-primary btn-block" onclick="showAddBankForm()" style="margin-top:16px;">
                <i class="fas fa-plus"></i> Add New Bank Account
            </button>

            <div id="addBankForm" class="hidden" style="margin-top:16px;">
                <div class="card">
                    <h4 style="color:var(--cyan);margin-bottom:12px;">Add Bank Account</h4>
                    <div class="form-group">
                        <label>🏦 Bank Name</label>
                        <input type="text" class="form-input" id="bankName" placeholder="e.g., GTBank, Moniepoint, Palmpay...">
                        <small style="color:var(--text-dim);margin-top:4px;display:block;">Please enter your bank name correctly</small>
                    </div>
                    <div class="form-group">
                        <label>🔢 Account Number</label>
                        <input type="text" class="form-input" id="bankAcctNo" maxlength="10" placeholder="10 digits">
                    </div>
                    <div class="form-group">
                        <label>👤 Account Name</label>
                        <input type="text" class="form-input" id="bankAcctName" placeholder="Your account name">
                    </div>
                    <button class="btn btn-success btn-block" onclick="saveBank()">
                        <i class="fas fa-save"></i> Save Account
                    </button>
                    <button class="btn btn-outline btn-block" onclick="hideAddBankForm()" style="margin-top:10px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="plans.html" class="nav-item"><i class="fas fa-layer-group"></i><span>Plans</span></a>
        <a href="deposit.html" class="nav-item"><i class="fas fa-credit-card"></i><span>Deposit</span></a>
        <a href="tasks.html" class="nav-item"><i class="fas fa-tasks"></i><span>Tasks</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=3"></script>
    <script>
        const user = checkAuth();
        if (!user) window.location.href = 'login.html';
        let currentUser = user;

        window.addEventListener('load', async () => {
            currentUser = await refreshUser();
            if (!currentUser || !currentUser.id) {
                window.location.href = 'login.html';
                return;
            }
            loadBanks();
        });

        function showAddBankForm() {
            document.getElementById('addBankForm').classList.remove('hidden');
            document.getElementById('bankName').value = '';
            document.getElementById('bankAcctNo').value = '';
            document.getElementById('bankAcctName').value = '';
        }

        function hideAddBankForm() {
            document.getElementById('addBankForm').classList.add('hidden');
        }

        async function loadBanks() {
            try {
                const { data, error } = await sb
                    .from('banks').select('*').eq('user_id', currentUser.id);
                if (error) throw error;

                let html = '';
                if (!data || data.length === 0) {
                    html = '<p style="color:var(--text-dim);text-align:center;">No bank accounts saved yet.</p>';
                } else {
                    data.forEach(bank => {
                        html += `<div class="bank-list-item">
                            <div class="bank-info">
                                <div class="bank-name">${bank.bank_name}</div>
                                <div class="bank-detail">${bank.acct_no} • ${bank.acct_name}</div>
                            </div>
                            <button class="delete-bank-btn" onclick="deleteBank('${bank.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>`;
                    });
                }
                document.getElementById('savedBanks').innerHTML = html;
            } catch (error) {
                console.error('Load banks error:', error);
                document.getElementById('savedBanks').innerHTML = '<p style="color:var(--danger);text-align:center;">Error loading banks</p>';
            }
        }

        async function saveBank() {
            const bn = document.getElementById('bankName').value.trim();
            const no = document.getElementById('bankAcctNo').value.trim();
            const na = document.getElementById('bankAcctName').value.trim();

            if (!bn || !no || !na) return toast('❌ Fill all fields');
            if (no.length !== 10 || !/^\d+$/.test(no)) return toast('❌ Account number must be 10 digits');

            try {
                await sb.from('banks').insert({
                    user_id: currentUser.id,
                    bank_name: bn,
                    acct_no: no,
                    acct_name: na
                });
                toast('✅ Bank account saved!');
                hideAddBankForm();
                loadBanks();
            } catch (error) {
                console.error('Save bank error:', error);
                toast('❌ Failed to save');
            }
        }

        async function deleteBank(id) {
            if (!confirm('Delete this bank account?')) return;
            try {
                await sb.from('banks').delete().eq('id', id);
                toast('Removed');
                loadBanks();
            } catch (error) {
                toast('❌ Failed to delete');
            }
        }
    </script>
</body>
</html>
