<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>History - SciNovaTech</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .history-container { max-width: 600px; margin: 0 auto; }
        .filter-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .history-card {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid var(--border);
            transition: all 0.3s;
            animation: fadeSlideIn 0.3s ease forwards;
            opacity: 0;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .history-card.deposit { border-left-color: var(--success); }
        .history-card.withdrawal { border-left-color: var(--danger); }
        .history-card.task { border-left-color: var(--gold); }
        .history-card.referral { border-left-color: var(--purple); }
        .history-card.bonus { border-left-color: var(--cyan); }
        .history-card.plan { border-left-color: var(--warning); }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .history-type { font-weight: 700; font-size: 0.9em; }
        .history-amount { font-weight: 800; font-size: 1.1em; font-family: 'Space Grotesk', sans-serif; }
        .history-amount.positive { color: var(--success); }
        .history-amount.negative { color: var(--danger); }
        .history-detail { color: var(--text-dim); font-size: 0.78em; line-height: 1.5; }
        .history-date { color: var(--text-mute); font-size: 0.7em; margin-top: 5px; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: var(--warning); }
        .status-approved, .status-successful, .status-credited { background: rgba(34,197,94,0.2); color: var(--success); }
        .status-rejected, .status-failed { background: rgba(239,68,68,0.2); color: var(--danger); }
    </style>
</head>
<body>

    <header class="header">
        <a href="home.html" class="logo">
            <img src="assets/img/logo.svg" alt="SciNovaTech">
            <span>SciNovaTech</span>
        </a>
        <div class="icons">
            <a href="profile.html"><i class="fas fa-user-circle"></i></a>
        </div>
    </header>

    <div class="main-content">
        <a href="home.html" style="color:var(--cyan);text-decoration:none;display:flex;align-items:center;gap:5px;margin-bottom:15px;font-size:0.9em;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="history-container">
            <h3 style="color:var(--cyan);margin-bottom:15px;">📜 Transaction History</h3>

            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all" onclick="filterHistory('all')">📊 All</button>
                <button class="filter-tab" data-filter="deposit" onclick="filterHistory('deposit')">💳 Deposits</button>
                <button class="filter-tab" data-filter="withdrawal" onclick="filterHistory('withdrawal')">💸 Withdrawals</button>
                <button class="filter-tab" data-filter="task" onclick="filterHistory('task')">📝 Tasks</button>
                <button class="filter-tab" data-filter="referral" onclick="filterHistory('referral')">👥 Referrals</button>
                <button class="filter-tab" data-filter="bonus" onclick="filterHistory('bonus')">🎁 Bonuses</button>
                <button class="filter-tab" data-filter="plan" onclick="filterHistory('plan')">💰 Plans</button>
            </div>

            <div id="historyList">
                <div class="empty-state">
                    <div class="spinner"></div>
                    <p>Loading transactions...</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="plans.html" class="nav-item"><i class="fas fa-layer-group"></i><span>Plans</span></a>
        <a href="deposit.html" class="nav-item"><i class="fas fa-credit-card"></i><span>Deposit</span></a>
        <a href="tasks.html" class="nav-item"><i class="fas fa-tasks"></i><span>Tasks</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script>
        const user = checkAuth();
        if (!user) window.location.href = 'login.html';

        let currentUser = user;
        let allTransactions = [];
        let currentFilter = 'all';

        window.addEventListener('load', async () => {
            try {
                currentUser = await refreshUser();
                await loadAllHistory();

                const urlParams = new URLSearchParams(window.location.search);
                const filter = urlParams.get('filter');
                if (filter) filterHistory(filter);
            } catch (error) {
                console.error('Init error:', error);
                toast('Error loading history');
            }
        });

        async function loadAllHistory() {
            document.getElementById('historyList').innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading transactions...</p></div>';
            allTransactions = [];

            try {
                // Deposits
                const { data: deps } = await sb.from('deposits').select('*').eq('user_id', currentUser.id);
                (deps || []).forEach(d => {
                    allTransactions.push({
                        type: 'deposit',
                        amount: Number(d.amount || 0),
                        status: d.status || 'pending',
                        date: d.date,
                        ref: d.ref || '',
                        payerName: d.payer_name || '',
                        payerAccount: d.payer_account || '',
                        channel: d.channel || 'manual'
                    });
                });

                // Withdrawals
                const { data: wths } = await sb.from('withdrawals').select('*').eq('user_id', currentUser.id);
                (wths || []).forEach(w => {
                    allTransactions.push({
                        type: 'withdrawal',
                        amount: Number(w.amount || 0),
                        fee: Number(w.fee || 0),
                        net: Number(w.net || 0),
                        status: w.status || 'pending',
                        date: w.date,
                        bankName: w.bank_name || '',
                        acctNo: w.acct_no || ''
                    });
                });

                // Payments (plan purchases)
                const { data: pays } = await sb.from('payments').select('*').eq('user_id', currentUser.id);
                (pays || []).forEach(p => {
                    allTransactions.push({
                        type: 'plan',
                        amount: Number(p.amount || 0),
                        status: p.status || 'approved',
                        date: p.date,
                        package: p.package || ''
                    });
                });

                // Referrals
                const { data: refs } = await sb.from('referrals').select('*').eq('referrer_id', currentUser.id);
                (refs || []).forEach(r => {
                    if (Number(r.earned) > 0) {
                        allTransactions.push({
                            type: 'referral',
                            amount: Number(r.earned || 0),
                            status: r.status || 'credited',
                            date: r.date,
                            refereeName: r.referee_name || '',
                            level: r.level || 1
                        });
                    }
                });

                // Welcome bonuses
                const { data: bonusDeps } = await sb.from('deposits').select('*')
                    .eq('user_id', currentUser.id).eq('channel', 'bonus');
                (bonusDeps || []).forEach(d => {
                    allTransactions.push({
                        type: 'bonus',
                        amount: Number(d.amount || 0),
                        status: 'credited',
                        date: d.date,
                        note: d.note || 'Welcome Bonus'
                    });
                });

                // Task earnings from last 60 days
                for (let i = 0; i < 60; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toISOString().split('T')[0];
                    const { data: ut } = await sb.from('user_tasks').select('*')
                        .eq('user_id', currentUser.id).eq('date', dateStr).maybeSingle();
                    if (ut && ut.tasks && ut.tasks.length > 0) {
                        const totalEarned = ut.tasks.reduce((s, t) => s + (t.earned || 0), 0);
                        const readingBonus = ut.reading_reward_claimed ? 100 : 0;
                        if (totalEarned + readingBonus > 0) {
                            allTransactions.push({
                                type: 'task',
                                amount: totalEarned + readingBonus,
                                completed: ut.tasks.filter(t => t.done).length,
                                readingClaimed: ut.reading_reward_claimed,
                                status: 'credited',
                                date: dateStr
                            });
                        }
                    }
                }

                allTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderHistory();

            } catch (error) {
                console.error('History error:', error);
                document.getElementById('historyList').innerHTML =
                    '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading history</p></div>';
            }
        }

        function getStatusLabel(status) {
            switch (status) {
                case 'pending': return '⏳ Pending';
                case 'approved': return '✅ Approved';
                case 'successful': return '✅ Successful';
                case 'rejected': return '❌ Rejected';
                case 'failed': return '❌ Failed';
                case 'credited': return '✅ Credited';
                default: return '⏳ ' + (status || 'Pending');
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'pending': return 'status-pending';
                case 'approved':
                case 'successful':
                case 'credited': return 'status-approved';
                case 'rejected':
                case 'failed': return 'status-rejected';
                default: return 'status-pending';
            }
        }

        function renderHistory() {
            const filtered = currentFilter === 'all'
                ? allTransactions
                : allTransactions.filter(t => t.type === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('historyList').innerHTML =
                    `<div class="empty-state"><i class="fas fa-inbox"></i><p>No ${currentFilter} transactions yet</p></div>`;
                return;
            }

            let html = '';
            filtered.forEach((tx, i) => {
                const date = new Date(tx.date);
                const dateStr = date.toLocaleDateString('en-US', {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                }) + ' • ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let typeLabel, amountClass, amountPrefix;
                switch (tx.type) {
                    case 'deposit': typeLabel = '💳 Deposit'; amountClass = 'positive'; amountPrefix = '+'; break;
                    case 'withdrawal': typeLabel = '💸 Withdrawal'; amountClass = 'negative'; amountPrefix = '-'; break;
                    case 'task': typeLabel = '📝 Task Earnings'; amountClass = 'positive'; amountPrefix = '+'; break;
                    case 'referral': typeLabel = '👥 Referral (L' + (tx.level || 1) + ')'; amountClass = 'positive'; amountPrefix = '+'; break;
                    case 'bonus': typeLabel = '🎁 Welcome Bonus'; amountClass = 'positive'; amountPrefix = '+'; break;
                    case 'plan': typeLabel = '💰 Plan Purchase'; amountClass = 'negative'; amountPrefix = '-'; break;
                    default: typeLabel = '📋 Transaction'; amountClass = 'positive'; amountPrefix = '';
                }

                let detailHTML = '';
                if (tx.type === 'deposit') {
                    detailHTML = `Ref: ${tx.ref}`;
                    if (tx.payerName) detailHTML += ` • From: ${tx.payerName}`;
                } else if (tx.type === 'withdrawal') {
                    detailHTML = `Fee: ${fmt(tx.fee)} • Net: ${fmt(tx.net)}`;
                    if (tx.bankName) detailHTML += ` • ${tx.bankName}`;
                } else if (tx.type === 'task') {
                    detailHTML = `${tx.completed || 0}/3 Questions${tx.readingClaimed ? ' + ✅ Reading' : ''}`;
                } else if (tx.type === 'referral') detailHTML = `From: ${tx.refereeName || 'Referral'}`;
                else if (tx.type === 'plan') detailHTML = `Plan: ${tx.package || 'Purchase'}`;
                else if (tx.type === 'bonus') detailHTML = tx.note || 'Welcome Bonus';

                html += `
                <div class="history-card ${tx.type}" style="animation-delay:${i * 0.03}s;">
                    <div class="history-header">
                        <span class="history-type">
                            ${typeLabel}
                            <span class="status-badge ${getStatusClass(tx.status)}">${getStatusLabel(tx.status)}</span>
                        </span>
                        <span class="history-amount ${amountClass}">${amountPrefix}${fmt(tx.amount)}</span>
                    </div>
                    <div class="history-detail">${detailHTML}</div>
                    <div class="history-date">${dateStr}</div>
                </div>`;
            });

            document.getElementById('historyList').innerHTML = html;
        }

        function filterHistory(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-filter') === type);
            });
            renderHistory();
        }
    </script>
</body>
</html>
