<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SciNovaTech</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .register-container { max-width: 450px; margin: 0 auto; padding: 30px 20px; }
        .register-title { text-align: center; color: var(--cyan); margin-bottom: 8px; font-size: 1.5em; }
        .register-subtitle { text-align: center; color: var(--text-dim); margin-bottom: 25px; font-size: 0.9em; }

        .form-group { animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; }
        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.10s; }
        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.20s; }
        .form-group:nth-child(5) { animation-delay: 0.25s; }
        .form-group:nth-child(6) { animation-delay: 0.30s; }

        @keyframes slideIn { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:translateX(0)} }

        .btn-submit { margin-top: 20px; animation: slideIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards; animation-delay: 0.35s; opacity: 0; }
        .ref-hint { font-size: 0.75em; color: var(--text-dim); margin-top: 4px; }

        .bonus-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            color: var(--deep);
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.72em;
            margin-left: 6px;
            font-weight: 700;
            animation: softPulse 2s infinite;
        }
        @keyframes softPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

        .password-field { position: relative; }
        .password-field .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); transition: all 0.3s; }
        .password-field .toggle-password:hover { color: var(--cyan); }
        .form-input:focus { transform: translateY(-2px); }

        .password-match {
            font-size: 0.75em;
            margin-top: 4px;
            display: none;
        }
        .password-match.show { display: block; }
        .password-match.match { color: var(--success); }
        .password-match.no-match { color: var(--danger); }

        .register-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            color: var(--danger);
            font-size: 0.85em;
            display: none;
            text-align: center;
        }
        .register-error.show { display: block; }

        .brand-hero { text-align: center; margin-bottom: 20px; }
        .brand-hero img { width: 72px; height: 72px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="color:var(--cyan);font-weight:700;">SCN</span>
    </div>

    <div class="register-container">

        <div class="brand-hero">
            <img src="assets/img/logo.svg" alt="SciNovaTech">
        </div>

        <h2 class="register-title">✨ Create Your Account</h2>
        <p class="register-subtitle">Start earning from science & technology</p>

        <div class="register-error" id="registerError"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>👤 Full Name</label>
                <input type="text" class="form-input" id="regName" placeholder="Enter your full name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" class="form-input" id="regEmail" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>📱 Phone Number</label>
                <input type="tel" class="form-input" id="regPhone" placeholder="Enter your phone number" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <div class="password-field">
                    <input type="password" class="form-input" id="regPassword" placeholder="Create a password (min 4 chars)" required minlength="4" autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
                </div>
            </div>
            <div class="form-group">
                <label>🔐 Confirm Password</label>
                <div class="password-field">
                    <input type="password" class="form-input" id="regConfirmPassword" placeholder="Confirm your password" required minlength="4" autocomplete="new-password" oninput="checkPasswordMatch()">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regConfirmPassword', this)"></i>
                </div>
                <div class="password-match" id="passwordMatch"></div>
            </div>
            <div class="form-group">
                <label>🎁 Referral Code <span class="bonus-badge">₦500 Bonus</span></label>
                <input type="text" class="form-input" id="regRefCode" value="ADMIN" placeholder="Enter referral code">
                <p class="ref-hint">💡 Default: ADMIN. Enter a friend's code to help them earn!</p>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-submit" id="registerBtn">
                <i class="fas fa-rocket"></i> CREATE FREE ACCOUNT
            </button>
        </form>

        <p style="text-align:center;margin-top:20px;color:var(--text-dim);font-size:0.9em;">
            Already registered? <a href="login.html" style="color:var(--cyan);">Login →</a>
        </p>
        <p style="text-align:center;margin-top:10px;color:var(--text-dim);font-size:0.8em;">
            🔒 Secure Registration • 🎁 ₦500 Welcome Bonus
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=3"></script>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function checkPasswordMatch() {
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const matchEl = document.getElementById('passwordMatch');

            if (confirm.length === 0) {
                matchEl.classList.remove('show', 'match', 'no-match');
                return;
            }

            matchEl.classList.add('show');
            if (password === confirm) {
                matchEl.textContent = '✅ Passwords match!';
                matchEl.className = 'password-match show match';
            } else {
                matchEl.textContent = '❌ Passwords do not match';
                matchEl.className = 'password-match show no-match';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('registerError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('regRefCode').value = refCode;
                toast('🎁 Referral code applied: ' + refCode);
            }
            const savedUser = localStorage.getItem('scn_u');
            if (savedUser) {
                try {
                    const u = JSON.parse(savedUser);
                    if (u && u.id) window.location.href = 'home.html';
                } catch (e) {}
            }
        });

        async function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            let refCode = document.getElementById('regRefCode').value.trim();

            if (!name || !email || !phone || !password || !confirmPassword) {
                showError('Please fill all required fields');
                return;
            }
            if (password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }
            if (password !== confirmPassword) {
                showError('❌ Passwords do not match. Please try again.');
                return;
            }
            if (!refCode) refCode = 'ADMIN';

            const btn = document.getElementById('registerBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            try {
                // 1. Duplicate email check
                const { data: existingUser, error: checkError } = await sb
                    .from('users').select('id').eq('email', email).maybeSingle();
                if (checkError) throw checkError;
                if (existingUser) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    showError('⚠️ Email already registered. Please login.');
                    return;
                }

                // 2. Generate SCN ID
                const userId = generateUserId();

                // 3. Resolve referral code
                let referredBy = 'ADMIN';
                if (refCode && refCode !== 'ADMIN') {
                    const { data: refUser } = await sb
                        .from('users').select('id').eq('ref_code', refCode).maybeSingle();
                    if (refUser) referredBy = refUser.id;
                }

                // 4. Welcome bonus amount
                const settings = await getSiteSettings();
                const welcomeBonus = settings.welcomeBonus || WELCOME_BONUS;

                // 5. Create user
                const { error: insertErr } = await sb.from('users').insert({
                    id: userId,
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    balance: welcomeBonus,
                    total_earned: welcomeBonus,
                    tasks_completed: 0,
                    plan: 'none',
                    status: 'active',
                    ref_code: userId,
                    referred_by: referredBy,
                    ref_earnings: 0,
                    ref_count: 0,
                    owned_plans: [],
                    invested: false,
                    investment_amount: 0
                });
                if (insertErr) throw insertErr;

                // 6. Referral record
                const { error: refErr } = await sb.from('referrals').insert({
                    referrer_id: referredBy,
                    referee_id: userId,
                    referee_name: name,
                    level: 1,
                    earned: 0,
                    status: 'pending'
                });
                if (refErr) console.warn('Referral record error:', refErr);

                // 7. Bump referrer's ref_count
                if (referredBy !== 'ADMIN') {
                    const { data: refDoc } = await sb
                        .from('users').select('ref_count').eq('id', referredBy).maybeSingle();
                    if (refDoc) {
                        await sb.from('users')
                            .update({ ref_count: (refDoc.ref_count || 0) + 1 })
                            .eq('id', referredBy);
                    }
                }

                // 8. Welcome bonus deposit record
                const { error: depErr } = await sb.from('deposits').insert({
                    user_id: userId,
                    user_name: name,
                    amount: welcomeBonus,
                    channel: 'bonus',
                    status: 'approved',
                    ref: 'WELCOME-BONUS',
                    note: 'Welcome bonus on registration'
                });
                if (depErr) console.warn('Bonus deposit record error:', depErr);

                // 9. Local user object
                const newUser = {
                    id: userId,
                    name: name,
                    email: email,
                    phone: phone,
                    balance: welcomeBonus,
                    totalEarned: welcomeBonus,
                    tasksCompleted: 0,
                    plan: 'none',
                    status: 'active',
                    refCode: userId,
                    referredBy: referredBy,
                    refEarnings: 0,
                    refCount: 0,
                    ownedPlans: [],
                    invested: false,
                    investmentAmount: 0
                };
                localStorage.setItem('scn_u', JSON.stringify(newUser));

                toast('🎉 Account created! ₦' + welcomeBonus + ' welcome bonus added!');
                btn.disabled = false;
                btn.innerHTML = originalText;

                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);

            } catch (error) {
                console.error('Registration error:', error);
                btn.disabled = false;
                btn.innerHTML = originalText;

                if (error.message && error.message.includes('duplicate key')) {
                    showError('⚠️ Email already registered. Please login.');
                } else if (error.message && error.message.includes('Failed to fetch')) {
                    showError('❌ Network error. Please check your connection.');
                } else {
                    showError('❌ Registration failed: ' + (error.message || 'Please try again.'));
                }
            }
        }

        document.getElementById('regPassword').addEventListener('input', checkPasswordMatch);
        document.getElementById('regConfirmPassword').addEventListener('input', checkPasswordMatch);
    </script>
</body>
</html>
